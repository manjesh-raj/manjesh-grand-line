# R2-PROC-01 of the second full review: `main` went red twice in a row and
# nothing re-ran it. One of the two was an infrastructure failure - shard 2
# could not download the debug binary, and no suite ran at all (run
# 39914224694) - so the one signal for "is `main` healthy" stayed red after a
# merge that broke nothing.
#
# This workflow re-runs a failed `main` CI run once, and **only** when the
# failure was infrastructure. The `CI infrastructure` check in `ci.yml` is
# what decides that: it is red only when a test job failed outside its suites
# (checkout, toolchain, the binary download, an artifact upload). A run whose
# suites failed is never re-run from here, so a real suite failure can never
# be turned green by a retry. It stays red until a person looks at it.
#
# Once per run (`run_attempt == 1`), so an infrastructure failure that keeps
# happening is re-run once and then left red, rather than looping.
#
# R4-PROC-01 of the fourth full review read this workflow as having re-run a
# test failure on the push of #551. It had not - its log says "failed for a
# build or suite reason, not infrastructure. Not re-running it.", and that run
# has one attempt - but it looked exactly as if it had: the one job started
# for every failed `main` run, declined inside a step and finished green, so
# the Actions list showed a successful "Re-run main after an infrastructure
# failure" beside every suite failure. (The "passed on re-run" in that run was
# the runner's own `--rerun-failed`, which re-runs a failed suite once to name
# it flaky and still fails the run.)
#
# So the decision and the re-run were split into two jobs, and a suite
# failure left `rerun` skipped.
#
# R5-PROC-03 of review #5 found the remaining noise: a `workflow_run` trigger
# cannot filter on the conclusion, so this workflow still started for every
# completed `main` run and showed up skipped in the Actions list and in
# notifications - the last 15 runs, every one skipped. So it no longer listens.
# `ci.yml`'s `CI infrastructure` job starts it with `workflow_dispatch`, only
# for a first-attempt push to `main` whose verdict was infrastructure, and
# passes the run id. This workflow still re-reads that verdict itself before
# re-running anything, so a hand-started dispatch with the wrong id cannot
# re-run a suite failure.
#
# The dispatch is sent while the CI run is still finishing (its other jobs may
# be running), and `gh run rerun` needs a completed run, so the job first waits
# for it.
#
# `workflow_dispatch` only works for a workflow file on the default branch, so
# this takes effect from the merge that changes it and cannot be exercised by
# the pull request that changes it.

name: Re-run main after an infrastructure failure

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of the failed CI run on main
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: re-run an infrastructure failure on main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the CI run to finish, then re-run its failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "::error::run_id must be a numeric run id, got '$RUN_ID'"; exit 1 ;;
          esac
          for _ in $(seq 1 110); do
            status="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)"
            [ "$status" = completed ] && break
            sleep 30
          done
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          name="$(jq -r .name <<<"$run")"
          event="$(jq -r .event <<<"$run")"
          branch="$(jq -r .head_branch <<<"$run")"
          attempt="$(jq -r .run_attempt <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          echo "run $RUN_ID: $name, $event on $branch, attempt $attempt, $conclusion"
          if [ "$name" != CI ] || [ "$event" != push ] || [ "$branch" != main ] \
             || [ "$attempt" != 1 ] || [ "$conclusion" != failure ]; then
            echo "Not a failed first-attempt CI push run on main. It is not re-run."
            exit 0
          fi
          verdict="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "CI infrastructure") | .conclusion')"
          echo "CI infrastructure: ${verdict:-not reported}"
          if [ "$verdict" != failure ]; then
            echo "Run $RUN_ID failed for a build or suite reason, not infrastructure. It is not re-run."
            exit 0
          fi
          echo "Run $RUN_ID failed for an infrastructure reason. Re-running its failed jobs once."
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
