# GL-07 (production-readiness review): until this file existed, 41 self-test
# suites and a clean-build guarantee were both entirely opt-in. Every
# regression guard this project has painstakingly built - the contrast floors,
# the layout gotchas, the list-volume budgets, the store-durability proofs -
# only ran when somebody remembered to run it.
#
# Two jobs, deliberately separate:
#
#   build - `swift build` with warnings treated as failures. Cheap, and the
#           thing most likely to catch a bad merge.
#   test  - the headless-safe suite subset, via the same
#           `Scripts/run-all-tests.sh` a developer runs locally. `--ci` skips
#           the suites that need a real login session or the machine's own
#           Keychain; that list lives in the script, with a reason per entry,
#           so CI and local runs can never disagree about what "the tests" are.
#   test-windowed - the exact complement of the above (`--session-only`): the
#           ~50 suites that mount real `NSWindow`s and drive real AppKit
#           layout, accessibility presses, contrast measurement, terminal
#           rendering and WebKit visibility gating.
#   generated - M4 of the end-to-end review: the `--check` mode of the
#           self-contained generator scripts, so drift in a committed
#           generated artifact fails a PR instead of waiting for somebody to
#           remember. See that job's own comment for which generators are in
#           scope and, more importantly, which are deliberately not.
#
# The full-app audit's §7.1 finding is why the third job exists: before it, a
# PR merge exercised *none* of that coverage. Every one of those suites was
# local-run-only, and nothing enforced a local full run before merge - so the
# app's most painstakingly-built regression guards (the layout gotchas, the
# contrast floors, the AppKit-cell quirks) were, in practice, opt-in.
#
# It is deliberately NON-BLOCKING (`continue-on-error: true`) to start.
# These suites need a window server, and a GitHub-hosted macOS runner has one
# only for the primary user - an environment property, not a property of this
# app. Going red on that would train everyone to ignore a red X, which is
# worse than the gap it closes. The intent is to flip it to blocking once it
# has a track record of being green; until then it is real, readable signal on
# every PR rather than nothing at all.
#
# The app itself is never launched. Every `FM_RUN_*` flag is handled before
# `NSApplication.shared` is touched, so the binary runs headless and exits -
# see the script's own SAFETY note and the README's "Never launch a built copy
# from a worktree".

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref - a macOS runner
  # minute is expensive enough to care.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  build:
    name: swift build
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # `build_native_app.sh` derives the version from `git describe`
          # (GL-18), so the tags have to be present for a packaging run to be
          # representative.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build
        # No `-warnings-as-errors`: this repo vendors SwiftTerm, YamlSwift and
        # whisper.cpp as source, and upstream C/C++ warnings are not this
        # project's to fix. The app's own target is warning-clean and the
        # step below is what enforces that.
        run: swift build 2>&1 | tee build.log

      - name: Fail on a warning in this app's own sources
        run: |
          if grep -E "Sources/FirstmateCockpit/.*warning:" build.log; then
            echo "::error::the app's own sources must build warning-clean"
            exit 1
          fi
          echo "no warnings in Sources/FirstmateCockpit"

      # GL-27: the self-test suites are compiled into debug builds only, which
      # means the release configuration is a genuinely different compilation
      # and can break on its own - a reference to a suite or a `debug*` shim
      # from outside `#if FM_SELFTESTS` compiles cleanly in debug and fails
      # only here. This is also what the shipped `.app` is built from, so it is
      # the configuration that actually has to work.
      - name: Build for release (the configuration the .app ships from)
        run: swift build -c release 2>&1 | tee release-build.log

      - name: Prove the release binary carries no test code
        run: |
          BIN=.build/release/FirstmateCockpit
          if strings -a "$BIN" | grep -q 'FM_RUN_'; then
            echo "::error::the release binary still contains FM_RUN_* self-test flags"
            strings -a "$BIN" | grep 'FM_RUN_' | head
            exit 1
          fi
          echo "release binary: no FM_RUN_* flags, $(stat -f%z "$BIN") bytes"

  test:
    name: self-test suites
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: swift build

      # Every store in this app honours an `FM_*` override for where it reads
      # and writes (see the README's env-var index). Pointing all of them at a
      # scratch directory keeps a CI run from attempting a real clone of the
      # private config repo, and makes the run reproducible instead of
      # depending on whatever the runner's home directory happens to contain.
      - name: Run the headless-safe suites
        env:
          FM_HOSTS_FILE: ${{ runner.temp }}/ci-stores/hosts.json
          FM_KEYS_FILE: ${{ runner.temp }}/ci-stores/keys.json
          FM_SNIPPETS_FILE: ${{ runner.temp }}/ci-stores/snippets.json
          FM_SCHEDULES_FILE: ${{ runner.temp }}/ci-stores/schedules.json
          FM_SHIFT_DIR: ${{ runner.temp }}/ci-stores/tasks
          FM_DICTATION_DIR: ${{ runner.temp }}/ci-stores/dictation
          FM_DOCS_DIR: ${{ runner.temp }}/ci-stores/docs
          FM_DOCS_RUNBOOKS_DIR: ${{ runner.temp }}/ci-stores/runbooks
          FM_COMMAND_LIBRARY_DIR: ${{ runner.temp }}/ci-stores/commands
          FM_LOG_ANALYZER_DIR: ${{ runner.temp }}/ci-stores/investigations
          FM_FLEET_LOG_DIR: ${{ runner.temp }}/ci-stores/fleet-log
          FM_INCIDENTS_DIR: ${{ runner.temp }}/ci-stores/incidents
          FM_CREDENTIAL_VAULT_DIR: ${{ runner.temp }}/ci-stores/grand-line-vault
          FM_WHISPER_MODEL_DIR: ${{ runner.temp }}/ci-stores/whisper
          FM_INSTANCE_LOCK_FILE: ${{ runner.temp }}/ci-stores/instance.lock
        run: ./Scripts/run-all-tests.sh --ci --no-build

  test-windowed:
    name: self-test suites (window-backed)
    runs-on: macos-14
    # A bound, because this job has already needed one: its first run hung and
    # was killed by GitHub's own 6-hour cap, producing no usable log. The
    # runner script now bounds each suite individually (`FM_SUITE_TIMEOUT`), so
    # this is only the backstop for the whole job.
    timeout-minutes: 60
    # Non-blocking on purpose - see this file's header for the full reasoning.
    # In short: these suites need a window server, which is a property of the
    # runner rather than of this app, and a red X nobody can act on is worse
    # than the coverage gap it replaces. Flip this to `false` once the job has
    # a track record of being green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: swift build

      # Deliberately identical to the `test` job's block above. GitHub Actions
      # supports neither YAML anchors nor a workflow-level `env` that can see
      # `runner.temp`, so this is duplicated rather than shared - keep the two
      # in sync. (The app's own `main.swift` self-test redirect block is the
      # real backstop: it points every store reachable from a bare production
      # constructor at a scratch directory for any `FM_RUN_*` process, so a
      # suite cannot reach real data even if a line here is ever missed.)
      - name: Run the window-backed suites
        env:
          FM_HOSTS_FILE: ${{ runner.temp }}/ci-stores/hosts.json
          FM_KEYS_FILE: ${{ runner.temp }}/ci-stores/keys.json
          FM_SNIPPETS_FILE: ${{ runner.temp }}/ci-stores/snippets.json
          FM_SCHEDULES_FILE: ${{ runner.temp }}/ci-stores/schedules.json
          FM_SHIFT_DIR: ${{ runner.temp }}/ci-stores/tasks
          FM_DICTATION_DIR: ${{ runner.temp }}/ci-stores/dictation
          FM_DOCS_DIR: ${{ runner.temp }}/ci-stores/docs
          FM_DOCS_RUNBOOKS_DIR: ${{ runner.temp }}/ci-stores/runbooks
          FM_COMMAND_LIBRARY_DIR: ${{ runner.temp }}/ci-stores/commands
          FM_LOG_ANALYZER_DIR: ${{ runner.temp }}/ci-stores/investigations
          FM_FLEET_LOG_DIR: ${{ runner.temp }}/ci-stores/fleet-log
          FM_INCIDENTS_DIR: ${{ runner.temp }}/ci-stores/incidents
          FM_CREDENTIAL_VAULT_DIR: ${{ runner.temp }}/ci-stores/grand-line-vault
          FM_WHISPER_MODEL_DIR: ${{ runner.temp }}/ci-stores/whisper
          FM_INSTANCE_LOCK_FILE: ${{ runner.temp }}/ci-stores/instance.lock
        # `--ci` alongside `--session-only` is not a contradiction: the first
        # selects the window-backed suites, the second says this is a runner
        # and skips the handful that need the captain's own machine (see
        # CI_UNSUPPORTED in the script, where each entry carries its measured
        # reason).
        run: ./Scripts/run-all-tests.sh --session-only --ci --no-build

  generated:
    name: generated files match their inputs
    runs-on: macos-14
    # Minutes, not tens of minutes: no Swift build, no app, three scripts.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        # The two icon generators decode and re-encode the committed source
        # PNGs to rebuild their base64 payloads. The shader generator needs
        # nothing beyond the standard library.
        #
        # **The version is pinned, and this job's first run is why.** A
        # byte-for-byte `--check` re-encodes each PNG, and PNG *compression*
        # output depends on the Pillow build - so an unpinned install turns a
        # drift guard into a coin flip. Measured, not guessed: the committed
        # icons match under 11.3.0 and Pillow **12.3.0 changes exactly one** of
        # the 19 rail icons (`PostmortemsIcon.swift`) with identical pixels and
        # an identical source PNG. Unpinned, this job failed on its very first
        # run for that reason alone - the same "a drift failure would as often
        # mean the toolchain moved" flakiness this job's own comment above
        # rejects the npm bundle rebuilds for.
        #
        # So the pin is the version the committed artifacts were generated
        # with. **Regenerating them with a newer Pillow means bumping this pin
        # in the same commit** - otherwise CI will report drift that is real
        # (the bytes did change) but attribute it to the wrong thing.
        run: python3 -m pip install --quiet 'Pillow==11.3.0'

      # M4 (end-to-end review): ~20 base64-embedded Swift files, the vendored
      # Monaco/Excalidraw bundles and the merged Metal shader are all generated
      # artifacts, and nothing anywhere ran their `--check`. Drift in one of
      # them **compiles cleanly** - it is a valid Swift file either way - so the
      # only thing standing between a hand-edit (or a forgotten regen after
      # changing a source asset) and shipping a stale artifact was a human
      # remembering to run the script by hand.
      #
      # Four generators are in scope, and they are exactly the ones whose
      # inputs live in this repository:
      #
      #   build-card-shortcut-icons.py   4 icons, sources in Scripts/assets/
      #   build-rail-icons-batch2.py    15 icons, sources in Scripts/assets/
      #   build-straw-hat-flag.py        the Jolly Roger, source in
      #                                  Scripts/assets/straw-hat-flag/
      #   build-whisper-metal-shader.py  the Metal shader, merged from the
      #                                  vendored whisper.cpp sources
      #
      # The flag generator joined that list in the review's own L1 fix: its
      # `--source` used to default into firstmate's `data/` directory, outside
      # this repository, which is exactly why it was excluded here. Its one
      # 110KB reference PNG is now committed beside the two icon batches'
      # sources, so the whole regenerate-and-diff loop is reproducible from a
      # clean clone and the exclusion no longer applies.
      #
      # Deliberately NOT in scope, with reasons rather than silence:
      #
      #   build-straw-hat-portraits.py - its inputs are seven base64 portraits
      #     embedded in a ~12MB plan-artifact HTML on the firstmate side, so
      #     `--check` here would still fail for the environment rather than for
      #     drift. Committing a 12MB HTML document is a materially different
      #     decision from committing the flag's single 110KB PNG, and one this
      #     job should not make on the captain's behalf. Its `--check` is
      #     in-memory now either way (L1's other half), so a local run leaves
      #     nothing behind.
      #   build-monaco-web.sh / build-excalidraw-web.sh - a rebuild-and-diff
      #     needs node + a full npm install of an upstream package whose
      #     transitive tree is not pinned by this repo, so a "drift" failure
      #     would as often mean "npm resolved a different patch version today".
      #     Worth doing as a scheduled job with a pinned lockfile; not worth
      #     making every PR wait for it, and not worth a flaky red X.
      - name: Card shortcut icons
        run: python3 Scripts/build-card-shortcut-icons.py --check

      - name: Rail icons (batch 2)
        run: python3 Scripts/build-rail-icons-batch2.py --check

      - name: Straw Hat Jolly Roger
        run: python3 Scripts/build-straw-hat-flag.py --check

      - name: Whisper Metal shader
        run: python3 Scripts/build-whisper-metal-shader.py --check
