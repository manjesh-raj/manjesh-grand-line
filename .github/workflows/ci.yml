# GL-07 (production-readiness review): until this file existed, 41 self-test
# suites and a clean-build guarantee were both entirely opt-in. Every
# regression guard this project has painstakingly built - the contrast floors,
# the layout gotchas, the list-volume budgets, the store-durability proofs -
# only ran when somebody remembered to run it.
#
# The jobs, deliberately separate:
#
#   build - `swift build` with warnings treated as failures, plus the release
#           compile. Cheap, the thing most likely to catch a bad merge, and
#           since P2 the one place the debug binary is compiled: the test
#           jobs take it from here as an artifact instead of building their
#           own. Since the CI speed-up it is three jobs: `build-debug` (the
#           binary the tests wait for), `build-release` beside the tests, and
#           the `swift build` check, which passes only when both do.
#   test  - the headless-safe suite subset, via the same
#           `Scripts/run-all-tests.sh` a developer runs locally. `--ci` skips
#           the suites that need a real login session or the machine's own
#           Keychain; that list lives in the script, with a reason per entry,
#           so CI and local runs can never disagree about what "the tests" are.
#   test-windowed - the exact complement of the above (`--session-only`): the
#           suites that mount real `NSWindow`s and drive real AppKit
#           layout, accessibility presses, contrast measurement, terminal
#           rendering and WebKit visibility gating. It runs as three shards
#           side by side (`test-windowed-shard`), and the `self-test suites
#           (window-backed)` check passes only when every shard did and the
#           shards between them ran each suite exactly once.
#   infrastructure - R2-PROC-01 of the second full review: `CI infrastructure`
#           goes red when a test job failed outside its suites (the binary
#           download, checkout, the toolchain), so that kind of red is told
#           apart from a suite failure. See the job's own comment.
#   widget - P11 of the 2026-09-25 review: `build-widget-extension.sh --check`.
#           The WidgetKit extension is not a SwiftPM target, so `swift build`
#           never compiles it - and `WidgetSharedContract.swift` is compiled
#           into both binaries, so an import added to it breaks the extension
#           and nothing else.
#   python  - P11: `ruff` over the ~4.4K lines of security-relevant Python.
#           Their unittest suites already ran (the `test` job runs them); the
#           lint is new. `native/Scripts/ruff.toml` carries the rule set and
#           the reason each large group is left out.
#   generated - M4 of the end-to-end review: the `--check` mode of the
#           self-contained generator scripts, so drift in a committed
#           generated artifact fails a PR instead of waiting for somebody to
#           remember. See that job's own comment for which generators are in
#           scope and, more importantly, which are deliberately not.
#
# The full-app audit's §7.1 finding is why the third job exists: before it, a
# PR merge exercised *none* of that coverage. Every one of those suites was
# local-run-only, and nothing enforced a local full run before merge - so the
# app's most painstakingly-built regression guards (the layout gotchas, the
# contrast floors, the AppKit-cell quirks) were, in practice, opt-in.
#
# `test-windowed` shipped NON-BLOCKING, because these suites need a window
# server and a GitHub-hosted macOS runner has one only for the primary user -
# an environment property, not a property of this app, and a red X nobody can
# act on trains everyone to ignore red. It is BLOCKING now (P8 of full review
# #3): the track record its own comment asked for arrived, and every failure
# in it has been a real defect rather than an environmental one. See that
# job's own comment for the measurement.
#
# The app itself is never launched. Every `FM_RUN_*` flag is handled before
# `NSApplication.shared` is touched, so the binary runs headless and exits -
# see the script's own SAFETY note and the README's "Never launch a built copy
# from a worktree".

name: CI

# P2 (2026-09-25 review): this used to be `push: branches: ["**"]` plus
# `pull_request`, in two different concurrency groups, so every push to an
# `fm/*` branch with an open PR ran the whole workflow **twice** - 35 duplicate
# pairs in the 100 runs before the review, at 7-22 minutes of macOS runner time
# per job.
#
# `push` is now the default branch only, which is the post-merge run, and
# `pull_request` is what guards a branch before it lands. The one thing this
# gives up is CI on a branch with no PR open yet; `workflow_dispatch` covers
# the case where that is actually wanted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# P5 (full review #3): CI ran Swift **5.10** on `macos-14` while local
# development is on Swift **6.x**, and the two disagree about diagnostics in
# both directions while the `build` job below fails on *any* warning in this
# app's own sources. So a warning-clean local build said nothing about CI, and
# vice versa - measured twice in this project's own history (AGENTS.md records
# a 6.x-only `#ImplicitStrongCapture` set and a 5.10-only redundant-downcast
# warning, each breaking the other environment's build).
#
# The label is pinned rather than `macos-latest` on purpose: a drift guard
# whose own toolchain moves under it is not a guard. What is asserted is the
# *major* version, which is the part that has to match local - the exact Xcode
# inside an image is GitHub's to bump and not worth pinning.
#
# It is repeated literally in every job rather than factored into an `env`
# value, because `runs-on` does not accept the `env` context (only
# github/needs/strategy/matrix/vars/inputs) and an unresolvable expression
# there fails the job before a single step runs. Change them all together.
env:
  # Local development is on Swift 6.x (`swift --version` on the captain's
  # machine reports 6.3.3), and `Show toolchain` in every Swift job asserts
  # this major so a silent image regression to 5.x fails loudly instead of
  # producing a diagnostics set nobody can reproduce locally. Bump this, the
  # `runs-on` labels and native/README.md's Requirements section together,
  # and only after a real run has proved the new toolchain builds this app
  # warning-clean.
  EXPECTED_SWIFT_MAJOR: "6"

concurrency:
  # A new push supersedes an in-flight run for the same ref - a macOS runner
  # minute is expensive enough to care.
  group: ci-${{ github.ref }}
  # ...except on `main`, where it is the opposite of what anyone wants (P2).
  # Merges land 4-24 times a day, so a second merge routinely arrived while the
  # first one's run was still going and cancelled it: 15 of the 100 runs before
  # the review were cancelled `main` runs, so roughly one merge in seven never
  # got a completed run of its own exact tree. That is the run people actually
  # go back and read when something breaks in `/Applications`.
  #
  # A superseded PR run is still cancelled, which is where the saving is and
  # where nobody needs the old result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: native

jobs:
  # The debug build is the one the test jobs wait for, so it is a job of its
  # own: measured over 20 runs (2026-10-21 to 22), the old single `build` job
  # took a median 10.2 minutes, 6.5 of them the release compile below, and
  # both test jobs sat behind all of it for a binary that was ready at
  # minute 4. The release compile is `build-release`, side by side with the
  # tests, and `swift build` (the aggregate at the end of the build jobs)
  # still passes only when both builds do.
  build-debug:
    name: swift build (debug)
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # `build_native_app.sh` derives the version from `git describe`
          # (GL-18), so the tags have to be present for a packaging run to be
          # representative.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          if ! swift --version 2>&1 | grep -qE "Apple Swift version ${EXPECTED_SWIFT_MAJOR}\."; then
            echo "::error::expected a Swift ${EXPECTED_SWIFT_MAJOR}.x toolchain; this runner has something else."
            echo "::error::see this workflow's runner-image note and native/README.md's Requirements."
            exit 1
          fi

      - name: Build
        # No `-warnings-as-errors`: this repo vendors SwiftTerm, YamlSwift and
        # whisper.cpp as source, and upstream C/C++ warnings are not this
        # project's to fix. The app's own target is warning-clean and the
        # step below is what enforces that.
        run: swift build 2>&1 | tee build.log

      - name: Fail on a warning in this app's own sources
        run: |
          if grep -E "Sources/GrandLine/.*warning:" build.log; then
            echo "::error::the app's own sources must build warning-clean"
            exit 1
          fi
          echo "no warnings in Sources/GrandLine"

      # P2: the two test jobs used to run their own `swift build`, so one push
      # compiled the vendored whisper.cpp, SwiftTerm and YamlSwift three times
      # - 7.5-9.2 minutes each, none of it cached. They take this binary
      # instead and keep their `--no-build`.
      #
      # Only the executable travels. The suites still read the checked-out
      # sources (`SelfTestSources` resolves `#filePath`, which is an absolute
      # path baked in at compile time), and every job in a run checks out to
      # the same `/Users/runner/work/<repo>/<repo>` on the same runner image,
      # so a source guard resolves identically in the job that built it and in
      # the job that downloads it.
      #
      # An `actions/cache` of `native/.build` was considered and deliberately
      # not used: `actions/checkout` gives every file a fresh mtime, llbuild
      # keys its incremental decisions on file mtime and size, so a restored
      # `.build` would be rebuilt from scratch anyway and the cache would only
      # add a multi-gigabyte upload and download to each job.
      - name: Share the debug binary with the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: grandline-debug-binary
          path: native/.build/debug/GrandLine
          retention-days: 1
          if-no-files-found: error

  build-release:
    name: swift build (release)
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          if ! swift --version 2>&1 | grep -qE "Apple Swift version ${EXPECTED_SWIFT_MAJOR}\."; then
            echo "::error::expected a Swift ${EXPECTED_SWIFT_MAJOR}.x toolchain; this runner has something else."
            echo "::error::see this workflow's runner-image note and native/README.md's Requirements."
            exit 1
          fi

      # GL-27: the self-test suites are compiled into debug builds only, which
      # means the release configuration is a genuinely different compilation
      # and can break on its own - a reference to a suite or a `debug*` shim
      # from outside `#if FM_SELFTESTS` compiles cleanly in debug and fails
      # only here. This is also what the shipped `.app` is built from, so it is
      # the configuration that actually has to work.
      - name: Build for release (the configuration the .app ships from)
        run: swift build -c release 2>&1 | tee release-build.log

      - name: Prove the release binary carries no test code
        run: |
          BIN=.build/release/GrandLine
          if strings -a "$BIN" | grep -q 'FM_RUN_'; then
            echo "::error::the release binary still contains FM_RUN_* self-test flags"
            strings -a "$BIN" | grep 'FM_RUN_' | head
            exit 1
          fi
          echo "release binary: no FM_RUN_* flags, $(stat -f%z "$BIN") bytes"

      # R2-ARCH-09: the same promise for the `debug*` hooks and `*ForTests`
      # seams production files expose to the suites. Read off the symbol
      # table, because a hook left outside `#if FM_SELFTESTS` is usually
      # dead-stripped from this binary and the strings check above cannot see
      # it - and dead-stripping is not a guard. See the script's header.
      - name: Prove the release binary carries no test-only symbols
        run: Scripts/check-release-symbols.sh .build/release/GrandLine

  # `swift build`, the check this workflow has always reported: green only
  # when the debug build (warning-clean) and the release build both are. Same
  # name and same meaning as the single job it replaces, so nothing that
  # watches for it changes.
  build:
    name: swift build
    needs: [build-debug, build-release]
    if: ${{ !cancelled() }}
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    timeout-minutes: 5
    steps:
      - name: Both builds passed
        working-directory: .
        run: |
          echo "debug: ${{ needs.build-debug.result }}, release: ${{ needs.build-release.result }}"
          [ "${{ needs.build-debug.result }}" = success ] && [ "${{ needs.build-release.result }}" = success ]

  test:
    name: self-test suites
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    # P2: this job consumes the debug build's binary rather than compiling its
    # own, so it waits for it - and only for it, not for the release compile.
    needs: build-debug
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          if ! swift --version 2>&1 | grep -qE "Apple Swift version ${EXPECTED_SWIFT_MAJOR}\."; then
            echo "::error::expected a Swift ${EXPECTED_SWIFT_MAJOR}.x toolchain; this runner has something else."
            echo "::error::see this workflow's runner-image note and native/README.md's Requirements."
            exit 1
          fi

      # P2: built once in the `build` job above, not a fourth time here.
      #
      # R2-PROC-01: twice. The action already retries inside one attempt, and
      # `main` still went red on "Artifact download failed after 5 retries"
      # (run 39914224694, shard 2) with every suite untouched. A second attempt
      # after a pause is the retry the action's own loop cannot give: its five
      # tries are seconds apart, and a storage blip outlasts them. Only the
      # download is retried - nothing here can re-run or excuse a suite.
      - name: Take the debug binary from the build job
        id: binary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: grandline-debug-binary
          path: native/.build/debug
      - name: Wait before retrying the download
        if: ${{ steps.binary.outcome == 'failure' }}
        run: sleep 30
      - name: Take the debug binary from the build job (second attempt)
        if: ${{ steps.binary.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: grandline-debug-binary
          path: native/.build/debug
      - name: Make it executable
        # `upload-artifact` does not carry the executable bit, and the runner
        # script refuses to start without it (`[ ! -x "$BIN" ]`).
        run: chmod +x .build/debug/GrandLine

      # R2-PROC-06: the per-suite history, kept between runs. The cache
      # restores the newest history this branch can see (a pull request also
      # sees `main`'s), the runner appends this run and writes the lane's
      # flake summary into the job summary, and the file is saved for the
      # next run and uploaded for reading. Diagnostic only: none of these
      # steps can fail the job, and none changes what a suite failure does.
      - name: Restore the suite history
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/suite-history.json
          key: suite-history-headless-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-history-headless-

      # No store locations here any more (R2-PROC-02 of the second full
      # review). This step used to point fifteen stores at one shared
      # `ci-stores` folder, so every suite in a lane saw the stores the suites
      # before it had seeded - PR #520 measured a demo vault from one suite
      # leaving `CredentialVaultViewSelfTest` nothing to create. The runner now
      # gives each suite an empty `FM_SCRATCH_ROOT` of its own, and
      # `main.swift`'s redirect block points every store into it, so a CI run
      # and a local run isolate the suites the same way and neither can reach
      # the private config repo or the runner's home directory.
      - name: Run the headless-safe suites
        # `--rerun-failed` names a suite that failed and then passed; the run
        # still fails (R2-PROC-06). `--history` is described above.
        run: ./Scripts/run-all-tests.sh --ci --no-build --rerun-failed --history="$RUNNER_TEMP/suite-history.json"

      - name: Keep the suite history for the next run
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/suite-history.json
          key: suite-history-headless-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Share the suite history
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-history-headless
          path: ${{ runner.temp }}/suite-history.json
          retention-days: 30
          if-no-files-found: warn

  # The window-backed suites, in three shards that run side by side. As one
  # job they took a median 21.8 minutes over 20 runs, the longest stretch of
  # every CI run. `--shard=K/N` in the runner script splits the same selection
  # longest suite first onto the least-loaded shard, about 7 minutes each.
  # `test-windowed` below reports the old check, and checks that the shards
  # between them ran every suite in the selection exactly once.
  test-windowed-shard:
    name: self-test suites (window-backed, shard ${{ matrix.shard }} of ${{ matrix.of }})
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    # P2: same as `test` above - the debug build's binary, not another compile.
    needs: build-debug
    # A bound, because this job has already needed one: its first run hung and
    # was killed by GitHub's own 6-hour cap, producing no usable log. The
    # runner script now bounds each suite individually (`FM_SUITE_TIMEOUT`), so
    # this is only the backstop for the whole job.
    timeout-minutes: 60
    strategy:
      # Every shard runs to the end, so one red suite does not hide another
      # shard's results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        of: [3]
    # BLOCKING as of P8 (full review #3). This job shipped
    # `continue-on-error: true` with its own instruction to "flip this once the
    # job has a track record of being green", and it has one - measured over the
    # last 40 CI runs rather than asserted:
    #
    #   * `main`: 10 of 10 green. The job has never once failed on the default
    #     branch.
    #   * feature branches: 7 failures, every one a real defect in that
    #     branch's own code, every one fixed before merge. Two are written up
    #     in AGENTS.md - a nested `layoutSubtreeIfNeeded` that only *traps* on
    #     a runner, and a real `NSDraggingSession` that only wedges in a window
    #     the window server ignores. Both were latent bugs this job found.
    #   * 4 cancelled by the `concurrency` group, which is not a signal.
    #
    # That is the exact condition the original comment set: the red X has been
    # actionable every single time, and never environmental. Leaving it
    # non-blocking now means a PR can merge past a real, reproducible failure
    # this job already caught.
    #
    # If it ever does go red for a genuinely environmental reason, the fix is a
    # measured entry in `CI_UNSUPPORTED` in `Scripts/run-all-tests.sh` - where
    # every entry already carries the measurement that put it there - and not
    # reverting this line.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          if ! swift --version 2>&1 | grep -qE "Apple Swift version ${EXPECTED_SWIFT_MAJOR}\."; then
            echo "::error::expected a Swift ${EXPECTED_SWIFT_MAJOR}.x toolchain; this runner has something else."
            echo "::error::see this workflow's runner-image note and native/README.md's Requirements."
            exit 1
          fi

      # P2: built once in the `build` job above, not a fourth time here.
      # R2-PROC-01: with one retry, for the reason the `test` job gives.
      - name: Take the debug binary from the build job
        id: binary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: grandline-debug-binary
          path: native/.build/debug
      - name: Wait before retrying the download
        if: ${{ steps.binary.outcome == 'failure' }}
        run: sleep 30
      - name: Take the debug binary from the build job (second attempt)
        if: ${{ steps.binary.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: grandline-debug-binary
          path: native/.build/debug
      - name: Make it executable
        # `upload-artifact` does not carry the executable bit, and the runner
        # script refuses to start without it (`[ ! -x "$BIN" ]`).
        run: chmod +x .build/debug/GrandLine

      # R2-PROC-06: the per-suite history, kept between runs. The cache
      # restores the newest history this branch can see (a pull request also
      # sees `main`'s), the runner appends this run and writes the lane's
      # flake summary into the job summary, and the file is saved for the
      # next run and uploaded for reading. Diagnostic only: none of these
      # steps can fail the job, and none changes what a suite failure does.
      - name: Restore the suite history
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/suite-history.json
          key: suite-history-windowed-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-history-windowed-shard-${{ matrix.shard }}-

      # Each suite gets its own scratch root from the runner, as in the `test`
      # job above (R2-PROC-02).
      - name: Run the window-backed suites
        # `--ci` alongside `--session-only` is not a contradiction: the first
        # selects the window-backed suites, the second says this is a runner
        # and skips the handful that need the captain's own machine (see
        # CI_UNSUPPORTED in the script, where each entry carries its measured
        # reason).
        run: >-
          ./Scripts/run-all-tests.sh --session-only --ci --no-build --shard=${{ matrix.shard }}/${{ matrix.of }}
          --rerun-failed --history="$RUNNER_TEMP/suite-history.json"

      - name: Keep the suite history for the next run
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/suite-history.json
          key: suite-history-windowed-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Share the suite history
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-history-windowed-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite-history.json
          retention-days: 30
          if-no-files-found: warn

      # What this shard was given, for the aggregate job to check the shards
      # against the whole selection. Written even when a suite failed.
      - name: Record this shard's suites
        if: ${{ !cancelled() }}
        run: |
          ./Scripts/run-all-tests.sh --session-only --ci --list --shard=${{ matrix.shard }}/${{ matrix.of }} \
            | grep '^FM_RUN_' > "$RUNNER_TEMP/windowed-shard-${{ matrix.shard }}.txt"
      - name: Share this shard's suites
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windowed-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/windowed-shard-${{ matrix.shard }}.txt
          retention-days: 1
          if-no-files-found: error

  # `self-test suites (window-backed)`, the check this workflow has always
  # reported: green only when every shard passed and the shards between them
  # ran every window-backed suite exactly once. The second half is what stops
  # a matrix edit or a change to the script's split from quietly dropping a
  # suite out of CI.
  test-windowed:
    name: self-test suites (window-backed)
    needs: test-windowed-shard
    if: ${{ !cancelled() }}
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Take every shard's list
        uses: actions/download-artifact@v4
        with:
          pattern: windowed-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards

      - name: Every window-backed suite ran in exactly one shard
        run: |
          ./Scripts/run-all-tests.sh --session-only --ci --list | grep '^FM_RUN_' | sort > "$RUNNER_TEMP/expected.txt"
          cat "$RUNNER_TEMP"/shards/windowed-shard-*.txt | sort > "$RUNNER_TEMP/ran.txt"
          twice="$(uniq -d "$RUNNER_TEMP/ran.txt")"
          if [ -n "$twice" ]; then
            echo "::error::these suites ran in more than one shard:"
            echo "$twice"
            exit 1
          fi
          if ! diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/ran.txt"; then
            echo "::error::the shards did not run exactly the window-backed selection (< missing, > not in it)"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/ran.txt" | tr -d ' ') window-backed suites, each in exactly one shard"

      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.test-windowed-shard.result }}"
          [ "${{ needs.test-windowed-shard.result }}" = success ]

  # R2-PROC-01 of the second full review: a red test check used to mean either
  # "a suite failed" or "the runner could not fetch the binary", and nothing on
  # the check list told the two apart. `main` went red on the second kind
  # (run 39914224694: shard 2 could not download the debug binary, no suite
  # ran) and read exactly like the first.
  #
  # This check is the separate signal. It reads this attempt's own jobs from
  # the API and classifies every failed test job by the step that failed:
  #
  #   * a step named "Run the ..." is the suites themselves - a suite failure.
  #     That is the test checks' business, and this check stays green for it.
  #   * any other step (checkout, toolchain, the binary download, a shard's
  #     list upload) is infrastructure, and this check goes red, naming it.
  #
  # `swift build (debug)` counts as infrastructure only when its artifact
  # upload failed; a compile failure is a build failure, not the runner's.
  #
  # It never changes what the other checks report. A shard that could not run
  # its suites still fails `self-test suites (window-backed)`, because "every
  # window-backed suite passed" was not shown. This check only says why.
  # `.github/workflows/ci-rerun.yml` reads it to decide whether a failed `main`
  # run is re-run.
  #
  # `ubuntu-latest` rather than the pinned macOS label: it builds nothing and
  # runs no suite, only `gh api` and `jq`, so the runner image does not matter.
  infrastructure:
    name: CI infrastructure
    needs: [build-debug, test, test-windowed-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Tell an infrastructure failure from a suite failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          # One line per failed job we classify: name, then its failed steps.
          jq -r '
            .jobs[]
            | select(.name == "swift build (debug)"
                     or .name == "self-test suites"
                     or (.name | startswith("self-test suites (window-backed, shard")))
            | select(.conclusion == "failure" or .conclusion == "timed_out")
            | [.name, ([.steps[] | select(.conclusion == "failure" or .conclusion == "timed_out"
                                          or .conclusion == "cancelled") | .name] | join("; "))]
            | @tsv' jobs.json > failed.tsv

          infra=0
          {
            echo "### CI infrastructure"
            echo
            if [ ! -s failed.tsv ]; then
              echo "No test or debug-build job failed for an infrastructure reason in this attempt."
            else
              echo "| Job | Failed step | Kind |"
              echo "| --- | --- | --- |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job steps; do
            if [ "$job" = "swift build (debug)" ]; then
              case "$steps" in
                *"Share the debug binary"*) kind=infrastructure ;;
                *) kind=build ;;
              esac
            else
              case "$steps" in
                *"Run the "*) kind=suite ;;
                *) kind=infrastructure ;;
              esac
            fi
            echo "| $job | ${steps:-(none recorded)} | $kind |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$kind" = infrastructure ]; then
              infra=1
              echo "::error title=CI infrastructure::$job failed in '${steps:-an unrecorded step}', before or after its suites - not a suite failure. Re-run the job."
            else
              echo "$job: a $kind failure, which its own check reports."
            fi
          done < failed.tsv
          exit "$infra"

  generated:
    name: generated files match their inputs
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    # Minutes, not tens of minutes: no Swift build, no app, three scripts.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        # The two icon generators decode and re-encode the committed source
        # PNGs to rebuild their base64 payloads. The shader generator needs
        # nothing beyond the standard library.
        #
        # **The version is pinned, and this job's first run is why.** A
        # byte-for-byte `--check` re-encodes each PNG, and PNG *compression*
        # output depends on the Pillow build - so an unpinned install turns a
        # drift guard into a coin flip. Measured, not guessed: the committed
        # icons match under 11.3.0 and Pillow **12.3.0 changes exactly one** of
        # the 19 rail icons (`PostmortemsIcon.swift`) with identical pixels and
        # an identical source PNG. Unpinned, this job failed on its very first
        # run for that reason alone - the same "a drift failure would as often
        # mean the toolchain moved" flakiness this job's own comment above
        # rejects the npm bundle rebuilds for.
        #
        # So the pin is the version the committed artifacts were generated
        # with. **Regenerating them with a newer Pillow means bumping this pin
        # in the same commit** - otherwise CI will report drift that is real
        # (the bytes did change) but attribute it to the wrong thing.
        run: python3 -m pip install --quiet 'Pillow==11.3.0'

      # M4 (end-to-end review): ~20 base64-embedded Swift files, the vendored
      # Monaco/Excalidraw bundles and the merged Metal shader are all generated
      # artifacts, and nothing anywhere ran their `--check`. Drift in one of
      # them **compiles cleanly** - it is a valid Swift file either way - so the
      # only thing standing between a hand-edit (or a forgotten regen after
      # changing a source asset) and shipping a stale artifact was a human
      # remembering to run the script by hand.
      #
      # Five generators are in scope, and they are exactly the ones whose
      # inputs live in this repository:
      #
      #   build-card-shortcut-icons.py   4 icons, sources in Scripts/assets/
      #   build-rail-icons-batch2.py    15 icons, sources in Scripts/assets/
      #   build-whiteboard-icons.py     62 component chips, sources in
      #                                  Scripts/assets/whiteboard-icons/
      #   build-straw-hat-flag.py        the Jolly Roger, source in
      #                                  Scripts/assets/straw-hat-flag/
      #   build-whisper-metal-shader.py  the Metal shader, merged from the
      #                                  vendored whisper.cpp sources
      #
      # The flag generator joined that list in the review's own L1 fix: its
      # `--source` used to default into firstmate's `data/` directory, outside
      # this repository, which is exactly why it was excluded here. Its one
      # 110KB reference PNG is now committed beside the two icon batches'
      # sources, so the whole regenerate-and-diff loop is reproducible from a
      # clean clone and the exclusion no longer applies.
      #
      # Deliberately NOT in scope, with reasons rather than silence:
      #
      #   build-straw-hat-portraits.py - its inputs are seven base64 portraits
      #     embedded in a ~12MB plan-artifact HTML on the firstmate side, so
      #     `--check` here would still fail for the environment rather than for
      #     drift. Committing a 12MB HTML document is a materially different
      #     decision from committing the flag's single 110KB PNG, and one this
      #     job should not make on the captain's behalf. Its `--check` is
      #     in-memory now either way (L1's other half), so a local run leaves
      #     nothing behind.
      #   build-monaco-web.sh / build-excalidraw-web.sh - both gained a
      #     `--check` and a committed `package-lock.json` in P11, so the
      #     original objection ("npm resolved a different patch version
      #     today") no longer holds: `npm ci` installs exactly the lockfile
      #     and the rebuild is reproducible, measured - two rebuilds of the
      #     Excalidraw bundle came out byte-identical. What is left is cost:
      #     a node + npm install of Excalidraw, React and esbuild on every
      #     pull request, for bundles that change a few times a year. The
      #     review's own suggestion is a scheduled job, and that is the
      #     captain's call; `./Scripts/build-{monaco,excalidraw}-web.sh
      #     --check` is one command either way.
      - name: Card shortcut icons
        run: python3 Scripts/build-card-shortcut-icons.py --check

      - name: Rail icons (batch 2)
        run: python3 Scripts/build-rail-icons-batch2.py --check

      - name: Whiteboard component icons
        run: python3 Scripts/build-whiteboard-icons.py --check

      - name: Straw Hat Jolly Roger
        run: python3 Scripts/build-straw-hat-flag.py --check

      - name: Whisper Metal shader
        run: python3 Scripts/build-whisper-metal-shader.py --check

  widget:
    name: widget extension compiles
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    # P11 (2026-09-25 review): "`build-widget-extension.sh --check` is not in
    # CI even though `WidgetSharedContract.swift` compiles into both
    # binaries". SwiftPM has no bundle product, so the WidgetKit extension is
    # compiled by `swiftc` from its own script and `swift build` does not touch
    # it - which means the one file shared between the app and the extension
    # was only ever compiled one of the two ways CI checks. Adding an
    # `AppKit`/`Yaml` import to it breaks the extension and nothing else, and
    # nothing would have said so until somebody ran the script by hand.
    #
    # `--check` compiles and links without assembling or signing the `.appex`,
    # so it needs no Developer ID - which is the item the extension itself is
    # blocked on (see native/Widgets/README.md).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          if ! swift --version 2>&1 | grep -qE "Apple Swift version ${EXPECTED_SWIFT_MAJOR}\."; then
            echo "::error::expected a Swift ${EXPECTED_SWIFT_MAJOR}.x toolchain; this runner has something else."
            exit 1
          fi

      - name: Compile the widget extension
        run: ./Scripts/build-widget-extension.sh --check

  python:
    name: python lint and tests
    runs-on: macos-15   # keep all the macOS labels in sync - see the runner-image note above
    # P11: "the 4.4K lines of security-relevant Python have tests but no
    # `ruff`". The tests were already run by `run-all-tests.sh` (and so by the
    # `test` job); the lint is new. `Scripts/ruff.toml` carries the rule set
    # and, more usefully, the reason each large rule group is left out.
    #
    # Minutes, not tens of minutes: no Swift, no app.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Deliberately NOT the version the scripts run under. macOS ships
          # 3.9 as `python3` and `Scripts/ruff.toml` pins `target-version` to
          # match, so the rules ruff applies are the ones that suit the real
          # runtime whatever interpreter runs ruff itself.
          python-version: '3.12'

      - name: Install ruff
        # Pinned for the same reason the `generated` job pins Pillow: an
        # unpinned linter turns a green gate into a coin flip the day it adds
        # a rule.
        run: python3 -m pip install --quiet 'ruff==0.16.3'

      - name: Lint
        run: ruff check --config Scripts/ruff.toml Scripts/*.py
